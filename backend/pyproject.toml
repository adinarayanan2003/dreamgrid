[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamgrid"
version = "0.1.0"
description = "A visual 2D world-model lab for model-based planning."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=1.26",
  "pydantic>=2.8",
  "pillow>=10.4"
]

[project.optional-dependencies]
train = [
  "torch>=2.3"
]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dreamgrid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

